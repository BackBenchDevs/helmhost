name: Pages

on:
  push:
    branches: [main, master]
    paths:
      - "docs/**"
      - ".github/workflows/pages.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install mdBook
        run: |
          curl -sSL https://github.com/rust-lang/mdBook/releases/download/v0.4.40/mdbook-v0.4.40-x86_64-unknown-linux-gnu.tar.gz | tar -xz
          sudo mv mdbook /usr/local/bin/
      - name: Build
        run: mdbook build docs
      - name: Include appcast feeds
        run: |
          set -euo pipefail
          mkdir -p docs/book
          LIVE_BASE="https://docs.helmhost.bbdevs.com"
          # Prefer live CDN tips so docs-only deploys do not wipe signed feeds.
          for f in appcast.xml appcast-rcs.xml; do
            if curl -fsSL "${LIVE_BASE}/${f}" -o "docs/book/${f}"; then
              echo "using live ${f}"
            else
              cp -f "docs/appcast/${f}" "docs/book/${f}"
              echo "using stub ${f}"
            fi
          done
      - uses: actions/upload-pages-artifact@v3
        with:
          path: docs/book
  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
